<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HSW Shape Designer</title>
    <style>
        body{margin:0;font-family:sans-serif;background:#0d0d0d;color:#e0e0e0;display:flex;height:100vh}
        #sb{width:300px;background:#161618;padding:20px;border-right:1px solid #2a2a2e;overflow-y:auto}
        #cv{flex:1;display:flex;align-items:center;justify-content:center}
        svg{max-width:500px;max-height:500px}
        .z{fill:rgba(255,255,255,0.05);stroke:#555;stroke-width:1;cursor:pointer}
        .z:hover{fill:rgba(243,156,18,0.2)}
        .z.s{fill:rgba(243,156,18,0.5);stroke:#f39c12;stroke-width:1.5}
        .g{stroke:#333;stroke-width:0.5;stroke-dasharray:3,3;pointer-events:none}
        .l{fill:#888;font-size:9px;pointer-events:none;text-anchor:middle;dominant-baseline:central}
        button{background:#f39c12;border:none;color:#000;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;width:100%;margin-bottom:6px}
        button:hover{background:#e67e22}
        button.sec{background:transparent;border:1px solid #2a2a2e;color:#e0e0e0}
        #out{background:#111;border:1px solid #2a2a2e;border-radius:4px;padding:10px;font-family:monospace;font-size:0.75em;color:#aaa;white-space:pre-wrap;word-break:break-all;margin-top:8px}
        .info{font-size:0.75em;color:#888;margin-top:10px}
    </style>
</head>
<body>
<div id="sb">
    <h2 style="color:#f39c12;margin-top:0">HSW Designer</h2>
    <button onclick="mode='add';render()">Mode: Ajouter</button>
    <button class="sec" onclick="mode='remove';render()">Mode: Retirer</button>
    <div style="margin:10px 0;font-size:0.8em;color:#888" id="info">Zones: 0/12</div>
    <button onclick="genLog()">Generer log</button>
    <button class="sec" onclick="sel.clear();render()">Effacer</button>
    <div id="out">...</div>
    <button onclick="cp()" style="margin-top:6px">Copier log</button>
</div>
<div id="cv"><svg id="svg" viewBox="-120 -120 240 240"></svg></div>
<script>
const R=100,D60=Math.PI/3,D30=Math.PI/6;
let sel=new Set(),mode='add';
function hc(r){return Array.from({length:6},(_,i)=>({x:r*Math.cos(i*D60),y:r*Math.sin(i*D60)}))}
function p2p(p){return p.map((v,i)=>(i?'L':'M')+v.x.toFixed(2)+','+v.y.toFixed(2)).join(' ')+' Z'}
function hb(a){let x=a%(2*Math.PI);if(x<0)x+=2*Math.PI;const s=Math.floor(x/D60),c=hc(R),t=(x-s*D60)/D60;return{x:c[s].x+(c[(s+1)%6].x-c[s].x)*t,y:c[s].y+(c[(s+1)%6].y-c[s].y)*t}}
function zp(i){const s=i*D30,e=(i+1)*D30;return[{x:0,y:0},hb(s),hb(e)]}
function ct(p){return{x:p.reduce((s,v)=>s+v.x,0)/p.length,y:p.reduce((s,v)=>s+v.y,0)/p.length}}
function render(){
    const svg=document.getElementById('svg');
    const c=hc(R);
    let h='<path d="'+p2p(c)+'" fill="none" stroke="#444" stroke-width="1.5"/>';
    for(let i=0;i<12;i++){
        const p=zp(i),cl=sel.has(i)?'z s':'z';
        h+='<path d="'+p2p(p)+'" class="'+cl+'" onclick="tk('+i+')"/>';
    }
    for(let i=0;i<12;i++){
        const p=hb(i*D30);
        h+='<line x1="0" y1="0" x2="'+p.x+'" y2="'+p.y+'" class="g"/>';
    }
    for(let i=0;i<12;i++){
        const c=ct(zp(i)),lr=Math.hypot(c.x,c.y)*1.3,a=Math.atan2(c.y,c.x);
        h+='<text x="'+(Math.cos(a)*lr).toFixed(1)+'" y="'+(Math.sin(a)*lr).toFixed(1)+'" class="l">'+i+'</text>';
    }
    svg.innerHTML=h;
    document.getElementById('info').textContent='Zones: '+sel.size+'/12 (mode: '+mode+')';
}
function tk(i){mode==='add'?sel.add(i):sel.delete(i);render()}
function genLog(){
    if(!sel.size){document.getElementById('out').textContent='Rien selectionne';return}
    const s=Array.from(sel).sort();
    let log='HSW Shape Designer\nZones: '+s.map(i=>'z'+i).join(', ')+'\n';
    s.forEach(i=>log+='  z'+i+': '+(i*30)+'- '+((i+1)*30)+' degres\n');
    log+='Couverture: '+(sel.size/12*100).toFixed(0)+'%\n';
    document.getElementById('out').textContent=log;
}
function cp(){navigator.clipboard.writeText(document.getElementById('out').textContent)}
render();
</script>
</body>
</html>
