<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --bg-deep: #0d0d0d; --bg-side: #161618; --bg-group: #1e1e21;
            --text-main: #e0e0e0; --text-muted: #88888c;
            --accent: #f39c12; --accent-hover: #e67e22;
            --danger: #c0392b; --border: #2a2a2e;
        }
        #colorPickerContainer {
            position:absolute;
            display:none;
            z-index:1000;
            background:rgba(30,30,33,.9);
            border:1px solid var(--border);
            border-radius:4px;
            padding:8px;
            box-shadow:0 4px 12px rgba(0,0,0,.4);
        }
        #colorPickerContainer input[type="color"] {
            width:60px;
            height:30px;
            margin-right:8px;
            vertical-align:middle;
        }
        #colorPickerContainer .btn {
            padding:6px 10px;
            font-size:.8em;
            min-width:30px;
        }
        .color-square {
            width:20px;
            height:20px;
            background:#ff5733;
            display:inline-block;
            cursor:pointer;
            margin-right:10px;
            vertical-align:middle;
        }
        .btn { 
            background:transparent; 
            border:1px solid var(--border); 
            padding:10px 14px; 
            color:var(--text-main); 
            cursor:pointer; 
            border-radius:4px; 
            transition:all .2s; 
        }
        .btn:hover { background:rgba(255,255,255,.05); }
        .btn.active { 
            border-color:var(--accent); 
            background:rgba(243,156,18,.08); 
            color:var(--accent); 
            font-weight:600; 
        }
    </style>
</head>
<body>
    <div class="color-square" id="testColorSquare"></div>
    <div id="colorPickerContainer">
        <input type="color" id="layerColorPicker" value="#ff5733">
        <button id="colorPickerOkBtn" class="btn">OK</button>
    </div>

    <script>
        const colorSquare = document.getElementById('testColorSquare');
        const colorPickerContainer = document.getElementById('colorPickerContainer');
        const layerColorPicker = document.getElementById('layerColorPicker');
        const colorPickerOkBtn = document.getElementById('colorPickerOkBtn');

        colorSquare.addEventListener('click', e => {
            e.stopPropagation();
            const rect = colorSquare.getBoundingClientRect();
            colorPickerContainer.style.left = `${rect.right + window.scrollX + 8}px`;
            colorPickerContainer.style.top = `${rect.top + window.scrollY}px`;
            colorPickerContainer.style.display = 'block';
            layerColorPicker.focus();
        });

        if (colorPickerOkBtn) {
            colorPickerOkBtn.addEventListener('click', () => {
                colorSquare.style.backgroundColor = layerColorPicker.value;
                colorPickerContainer.style.display = 'none';
            });
        }

        // Also hide when clicking outside
        document.addEventListener('click', e => {
            if (colorPickerContainer && 
                colorPickerContainer.style.display === 'block' &&
                !colorPickerContainer.contains(e.target) &&
                e.target.className !== 'color-square') {
                colorPickerContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
