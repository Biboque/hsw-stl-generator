<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Éditeur d'Icônes HSW</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .editor {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .canvas-container {
            border: 2px solid #333;
            background: white;
            padding: 10px;
        }
        svg {
            border: 1px solid #ccc;
            background: white;
        }
        .controls {
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            min-width: 300px;
        }
        .point-input {
            margin: 10px 0;
        }
        .point-input label {
            display: inline-block;
            width: 60px;
        }
        .point-input input {
            width: 50px;
            margin-right: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .points-list {
            margin-top: 20px;
        }
        .point-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .color-picker {
            margin: 10px 0;
        }
        .export-code {
            margin-top: 20px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Éditeur d'Icônes HSW</h1>
    <p>Créez et modifiez des icônes SVG pour les pièces HSW</p>

    <div class="editor">
        <div class="canvas-container">
            <svg id="iconCanvas" width="120" height="120" viewBox="0 0 24 24">
                <!-- Hexagone de base -->
                <path id="hexagon" d="M 4.5 12 L 8.25 5.5 L 15.75 5.5 L 19.5 12 L 15.75 18.5 L 8.25 18.5 Z"
                      fill="none" stroke="#ccc" stroke-width="0.5" stroke-dasharray="1,1" opacity="0.5"/>
                <!-- Forme principale -->
                <path id="shape" d="" fill="none" stroke="#007bff" stroke-width="1.2" stroke-linejoin="round"/>
                <!-- Points de contrôle -->
                <g id="controlPoints"></g>
            </svg>
        </div>

        <div class="controls">
            <h3>Contrôles</h3>

            <div class="color-picker">
                <label>Couleur de remplissage:</label><br>
                <input type="color" id="fillColor" value="#007bff">
            </div>

            <div class="color-picker">
                <label>Couleur du contour:</label><br>
                <input type="color" id="strokeColor" value="#007bff">
            </div>

            <div class="point-input">
                <label>Point X:</label>
                <input type="number" id="pointX" step="0.1" value="12">
                <label>Y:</label>
                <input type="number" id="pointY" step="0.1" value="12">
                <button id="addPoint">Ajouter</button>
            </div>

            <div class="points-list">
                <h4>Points de la forme:</h4>
                <div id="pointsContainer"></div>
            </div>

            <button id="clearShape">Effacer tout</button>
            <button id="generateCode">Générer le code</button>

            <div class="export-code" id="exportCode" style="display:none;">
                <strong>Code SVG généré:</strong><br>
                <div id="svgCode"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const shape = document.getElementById('shape');
        const controlPoints = document.getElementById('controlPoints');
        const pointsContainer = document.getElementById('pointsContainer');

        let points = [];
        let selectedPoint = null;

        // Fonctions utilitaires
        function updateShape() {
            if (points.length < 2) {
                shape.setAttribute('d', '');
                return;
            }

            let pathData = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                pathData += ` L ${points[i].x} ${points[i].y}`;
            }
            if (points.length > 2) {
                pathData += ' Z'; // Fermer le path
            }

            shape.setAttribute('d', pathData);
            updateControlPoints();
            updatePointsList();
        }

        function updateControlPoints() {
            controlPoints.innerHTML = '';

            points.forEach((point, index) => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', point.x);
                circle.setAttribute('cy', point.y);
                circle.setAttribute('r', '1');
                circle.setAttribute('fill', '#ff0000');
                circle.setAttribute('stroke', '#000');
                circle.setAttribute('stroke-width', '0.5');
                circle.style.cursor = 'pointer';
                circle.dataset.index = index;

                circle.addEventListener('mousedown', (e) => {
                    selectedPoint = index;
                    e.preventDefault();
                });

                circle.addEventListener('mousemove', (e) => {
                    if (selectedPoint === index) {
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = 24 / rect.width;
                        const scaleY = 24 / rect.height;

                        point.x = (e.clientX - rect.left) * scaleX;
                        point.y = (e.clientY - rect.top) * scaleY;

                        updateShape();
                    }
                });

                controlPoints.appendChild(circle);
            });

            // Gestion du relâchement de la souris
            document.addEventListener('mouseup', () => {
                selectedPoint = null;
            });
        }

        function updatePointsList() {
            pointsContainer.innerHTML = '';

            points.forEach((point, index) => {
                const div = document.createElement('div');
                div.className = 'point-item';

                div.innerHTML = `
                    Point ${index + 1}: (${point.x.toFixed(1)}, ${point.y.toFixed(1)})
                    <button onclick="removePoint(${index})">×</button>
                `;

                pointsContainer.appendChild(div);
            });
        }

        // Gestionnaires d'événements
        document.getElementById('addPoint').addEventListener('click', () => {
            const x = parseFloat(document.getElementById('pointX').value);
            const y = parseFloat(document.getElementById('pointY').value);

            if (!isNaN(x) && !isNaN(y)) {
                points.push({ x, y });
                updateShape();
            }
        });

        document.getElementById('fillColor').addEventListener('input', (e) => {
            shape.setAttribute('fill', e.target.value);
        });

        document.getElementById('strokeColor').addEventListener('input', (e) => {
            shape.setAttribute('stroke', e.target.value);
        });

        document.getElementById('clearShape').addEventListener('click', () => {
            points = [];
            updateShape();
        });

        document.getElementById('generateCode').addEventListener('click', () => {
            if (points.length < 2) {
                alert('Ajoutez au moins 2 points pour générer le code');
                return;
            }

            let pathData = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 1; i < points.length; i++) {
                pathData += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
            }
            pathData += ' Z';

            const fill = document.getElementById('fillColor').value;
            const stroke = document.getElementById('strokeColor').value;

            const code = `<path d="${pathData}" fill="${fill}" stroke="${stroke}" stroke-width="1.2" stroke-linejoin="round" opacity="0.95"/>`;

            document.getElementById('svgCode').textContent = code;
            document.getElementById('exportCode').style.display = 'block';
        });

        // Fonction globale pour supprimer un point
        window.removePoint = function(index) {
            points.splice(index, 1);
            updateShape();
        };

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            updateShape();
        });
    </script>
</body>
</html>
