<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HSW Designer Pro</title>
    <style>
        :root {
            --bg-deep: #0d0d0d; --bg-side: #161618; --bg-group: #1e1e21;
            --text-main: #e0e0e0; --text-muted: #88888c;
            --accent: #f39c12; --accent-hover: #e67e22;
            --danger: #c0392b; --border: #2a2a2e;
        }
        body { margin:0; font-family:'Inter','Segoe UI',sans-serif; display:flex; height:100vh; background:var(--bg-deep); color:var(--text-main); overflow:hidden; font-size:13px; }
        #sidebar {
            width:300px; background:var(--bg-side); padding:25px;
            display:flex; flex-direction:column; gap:20px;
            border-right:1px solid var(--border); z-index:100;
            max-height:100vh; overflow-y:auto; overflow-x:hidden;
        }
        #sidebar-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:15px; }
        #sidebar-header h1 { margin:0; font-size:1.2em; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
        #sidebar-header span { color:var(--accent); }
        #canvas-container { flex-grow:1; position:relative; background: #0d0d0d; }
        .group { background:var(--bg-group); padding:18px; border-radius:6px; border:1px solid var(--border); }
        .group-header { font-size:.85em; text-transform:uppercase; color:var(--text-muted); letter-spacing:1.5px; margin-bottom:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .group-header::before { content:''; display:inline-block; width:6px; height:6px; background:var(--accent); border-radius:1px; }
        .btn { background:transparent; border:1px solid var(--border); padding:10px 14px; color:var(--text-main); cursor:pointer; border-radius:4px; width:100%; margin-bottom:8px; transition:all .2s; text-align:left; display:flex; align-items:center; gap:10px; font-size:.95em; }
        .btn:hover { background:rgba(255,255,255,.03); border-color:#444; }
        .btn.active { border-color:var(--accent); background:rgba(243,156,18,.08); color:var(--accent); font-weight:600; }
        .btn-main { background:var(--accent); border:none; color:#000; font-weight:700; text-align:center; justify-content:center; text-transform:uppercase; letter-spacing:1px; margin-top:10px; }
        .btn-main:hover { background:var(--accent-hover); }
        .btn-danger { background:transparent; border:1px solid rgba(192,57,43,.4); color:var(--danger); text-align:center; justify-content:center; font-size:.9em; margin-top:5px; }
        .btn-trio { display:flex; gap:4px; }
        .btn-trio .btn { flex:1; flex-direction:column; justify-content:center; align-items:center; padding:8px 3px; gap:4px; margin-bottom:0; font-size:.72em; text-align:center; }
        #hud { position:absolute; top:16px; right:16px; z-index:200; }
        #hud-stats {
            position:absolute; top:16px; left:16px; z-index:200;
            background:rgba(22,22,24,.9); border:1px solid var(--border); border-radius:6px;
            padding:10px 14px; font-size:.8em;
        }
        .hud-stat-row { display:flex; justify-content:space-between; gap:16px; margin-bottom:6px; }
    </style>
</head>
<body>
<div id="sidebar">
    <div id="sidebar-header">
        <h1>Babique's <span>HSW</span> Generator</h1>
        <div style="font-size:.8em;color:var(--text-muted);">v7.6</div>
    </div>
    <div class="group">
        <div class="group-header">Hexagones</div>
        <div class="btn-trio">
            <button id="addBtn" class="btn active">Creux</button>
            <button id="hexFullBtn" class="btn">Plein</button>
            <button id="hexFixFullBtn" class="btn">Fixation</button>
        </div>
    </div>
    <div class="group">
        <div class="group-header">Trapèzes</div>
        <div class="btn-trio">
            <button id="trapBtn" class="btn">Creux</button>
            <button id="trapFullBtn" class="btn">Plein</button>
            <button id="trapFixBtn" class="btn">Fixation</button>
        </div>
    </div>
    <div class="group">
        <div class="group-header">Pentagones</div>
        <div class="btn-trio">
            <button id="pentaBtn" class="btn">Creux</button>
            <button id="pentaFullBtn" class="btn">Plein</button>
            <button id="pentaFixBtn" class="btn">Fixation</button>
        </div>
    </div>
    <div class="group">
        <div class="group-header">Quarts</div>
        <div class="btn-trio">
            <button id="quartBtn" class="btn">Creux</button>
            <button id="quartFullBtn" class="btn">Plein</button>
            <button id="quartFixBtn" class="btn">Fixation</button>
        </div>
    </div>
    <div class="group">
        <div class="group-header">Actions</div>
        <button id="removeBtn" class="btn">Gomme</button>
        <button id="exportBtn" class="btn btn-main">Exporter STL</button>
        <button id="clearBtn" class="btn btn-danger">🗑 Tout effacer</button>
    </div>
</div>
<div id="canvas-container">
    <div id="hud-stats">
        <div class="hud-stat-row">
            <span>Éléments:</span>
            <span id="hexCount" style="color:var(--accent);font-weight:700;">0</span>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// Dimensions
const HOLE_W = 20;
const WALL = 1.8;
const WALL_MIN = 0.8;
const DEPTH = 8;
const H_STEP = 2;
const HEX_H = HOLE_W + WALL * 2;
const HEX_S = HEX_H / Math.sqrt(3);
const INNER_S = HOLE_W / Math.sqrt(3);
const DEG60 = Math.PI / 3;

function hexPts(r) {
    return Array.from({length:6}, (_,i) => new THREE.Vector2(r*Math.cos(i*DEG60), r*Math.sin(i*DEG60)));
}

function mergeGeos(geos) {
    const positions=[], normals=[], indices=[];
    let offset = 0;
    for (const g of geos) {
        const pos = g.attributes.position.array;
        const nor = g.attributes.normal?.array;
        const idx = g.index?.array;
        positions.push(...pos);
        if (nor) normals.push(...nor);
        const cnt = pos.length / 3;
        if (idx) indices.push(...idx.map(i => i + offset));
        else for (let i=0; i<cnt; i++) indices.push(i + offset);
        offset += cnt;
        g.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
    if (normals.length) geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(normals), 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
}

function extrude(shape, depth, z=0) {
    const geo = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:false});
    if (z) geo.translate(0, 0, z);
    return geo;
}

function shoulderPair(makeFn, sb) {
    const narrow = makeFn(INNER_S + (WALL - WALL_MIN));
    const full = makeFn(INNER_S);
    return sb
        ? mergeGeos([narrow(H_STEP, 0), full(DEPTH-H_STEP, H_STEP)])
        : mergeGeos([full(DEPTH-H_STEP, 0), narrow(H_STEP, DEPTH-H_STEP)]);
}

function buildHexByCrown(sb=false) {
    const outer = hexPts(HEX_S);
    return shoulderPair(innerS => {
        const inner = hexPts(innerS);
        return (depth, z) => {
            const shape = new THREE.Shape(outer);
            const hole = new THREE.Path();
            hole.moveTo(inner[0].x, inner[0].y);
            for (let i=5; i>=1; i--) hole.lineTo(inner[i].x, inner[i].y);
            hole.closePath();
            shape.holes.push(hole);
            return extrude(shape, depth, z);
        };
    }, sb);
}

function buildTrapGeometry(angle, sb=false) {
    const ext = hexPts(HEX_S);
    const geo = shoulderPair(innerS => {
        const inn = hexPts(innerS);
        return (depth, z) => {
            const s = new THREE.Shape();
            s.moveTo(ext[0].x,ext[0].y); s.lineTo(ext[1].x,ext[1].y);
            s.lineTo(ext[2].x,ext[2].y); s.lineTo(ext[3].x,ext[3].y);
            s.lineTo(ext[0].x,ext[3].y); s.closePath();
            const hy = ext[3].y + WALL;
            const h = new THREE.Path();
            h.moveTo(inn[0].x-WALL/2,hy); h.lineTo(inn[3].x+WALL/2,hy);
            h.lineTo(inn[2].x,inn[2].y); h.lineTo(inn[1].x,inn[1].y);
            h.lineTo(inn[0].x,inn[0].y); h.closePath();
            s.holes.push(h);
            return extrude(s, depth, z);
        };
    }, sb);
    if (angle) geo.rotateZ(angle);
    return geo;
}

function buildHexFullGeometry() {
    const outer = hexPts(HEX_S);
    const shape = new THREE.Shape(outer);
    return new THREE.ExtrudeGeometry(shape, {depth: DEPTH, bevelEnabled: false});
}

function sectorAngle(s) { return (s - 1) * Math.PI / 3; }

function buildPentaGeometry(corner, sb=false) {
    const ext = hexPts(HEX_S);
    const geo = shoulderPair(innerS => {
        const inn = hexPts(innerS);
        return (depth, z) => {
            const s = new THREE.Shape();
            s.moveTo(0, ext[1].y); s.lineTo(ext[1].x, ext[1].y);
            s.lineTo(ext[0].x, ext[0].y); s.lineTo(ext[5].x, ext[5].y);
            s.lineTo(0, ext[5].y); s.closePath();
            const h = new THREE.Path();
            h.moveTo(WALL, inn[5].y); h.lineTo(inn[5].x, inn[5].y);
            h.lineTo(inn[0].x, inn[0].y); h.lineTo(inn[1].x, inn[1].y);
            h.lineTo(WALL, inn[1].y); h.closePath();
            s.holes.push(h);
            return extrude(s, depth, z);
        };
    }, sb);
    geo.rotateZ(corner * DEG60);
    return geo;
}

function makeQuartOuterShape(ext, q) {
    const s = new THREE.Shape();
    if (q === 0) {
        s.moveTo(0, 0); s.lineTo(ext[0].x, ext[0].y); s.lineTo(ext[1].x, ext[1].y); s.lineTo(0, ext[1].y);
    } else if (q === 1) {
        s.moveTo(0, ext[1].y); s.lineTo(-ext[1].x, ext[1].y); s.lineTo(-ext[0].x, ext[0].y); s.lineTo(0, 0);
    } else if (q === 2) {
        s.moveTo(0, 0); s.lineTo(-ext[0].x, -ext[0].y); s.lineTo(-ext[1].x, -ext[1].y); s.lineTo(0, -ext[1].y);
    } else {
        s.moveTo(0, -ext[1].y); s.lineTo(ext[1].x, -ext[1].y); s.lineTo(ext[0].x, -ext[0].y); s.lineTo(0, 0);
    }
    s.closePath();
    return s;
}

function makeQuartHolePath(inn, q) {
    const hy = WALL;
    const h = new THREE.Path();
    if (q === 0) {
        h.moveTo(inn[0].x - WALL/2, hy); h.lineTo(WALL, hy);
        h.lineTo(WALL, inn[1].y); h.lineTo(inn[1].x, inn[1].y);
        h.lineTo(inn[0].x, inn[0].y);
    } else if (q === 1) {
        h.moveTo(-inn[0].x, inn[0].y); h.lineTo(-inn[1].x, inn[1].y);
        h.lineTo(-WALL, inn[1].y); h.lineTo(-WALL, hy);
        h.lineTo(-(inn[0].x - WALL/2), hy);
    } else if (q === 2) {
        h.moveTo(-(inn[0].x - WALL/2), -hy); h.lineTo(-WALL, -hy);
        h.lineTo(-WALL, -inn[1].y); h.lineTo(-inn[1].x, -inn[1].y);
        h.lineTo(-inn[0].x, -inn[0].y);
    } else {
        h.moveTo(inn[0].x - WALL/2, -hy); h.lineTo(WALL, -hy);
        h.lineTo(WALL, -inn[1].y); h.lineTo(inn[1].x, -inn[1].y);
        h.lineTo(inn[0].x, -inn[0].y);
    }
    h.closePath();
    return h;
}

function buildQuartGeometry(q, sb=false) {
    const ext = hexPts(HEX_S);
    const geo = shoulderPair(innerS => {
        const inn = hexPts(innerS);
        return (depth, z) => {
            const s = makeQuartOuterShape(ext, q);
            s.holes.push(makeQuartHolePath(inn, q));
            return extrude(s, depth, z);
        };
    }, sb);
    return geo;
}

function buildGeometry(type) {
    const sb = shoulderDir === 'back';
    if (type.startsWith('trap_')) { const s=+type.slice(5); return buildTrapGeometry(sectorAngle(s), sb); }
    if (type.startsWith('penta_')) { const c=+type.slice(6); return buildPentaGeometry(c, sb); }
    if (type.startsWith('quart_')) { const q=+type.slice(6); return buildQuartGeometry(q, sb); }
    if (type==='hexFull') return buildHexFullGeometry();
    return buildHexByCrown(sb);
}

// State
let scene, camera, renderer, controls;
let activeTool = 'add';
let shoulderDir = 'back';
const elements = new Map();
const elementTypes = new Map();
const hitPlanes = new Map();
const gridLines = [];

function cellPos(q, r) { return { x: q*HEX_S*1.5, y: r*HEX_H + (q%2 ? HEX_H/2 : 0) }; }

function slotKey(q, r, slot) { return `${q},${r}|${slot}`; }
function trapSlots(prefix) { return Array.from({length:6}, (_,i) => `${prefix}_${i}`); }
const ALL_SLOTS = ['hex','hexFull',...trapSlots('trap'),...trapSlots('penta'),...Array.from({length:4},(_,i)=>`quart_${i}`)];

function getSector(dx, dy) { let a = Math.atan2(dy, dx) * 180 / Math.PI; if (a < 0) a += 360; return Math.floor(a / 60) % 6; }
function getCorner(dx, dy) { let a = Math.atan2(dy, dx) * 180 / Math.PI; if (a < 0) a += 360; return Math.floor(a / 60) % 6; }
function getQuart(dx, dy) { if (dx >= 0 && dy >= 0) return 0; if (dx < 0 && dy >= 0) return 1; if (dx < 0 && dy < 0) return 2; return 3; }

function resolveType(tool, hitPt, cp) {
    const dx = hitPt.x - cp.x, dy = hitPt.y - cp.y;
    if (tool === 'trap') return `trap_${getSector(dx, dy)}`;
    if (tool === 'penta') return `penta_${getCorner(dx, dy)}`;
    if (tool === 'quart') return `quart_${getQuart(dx, dy)}`;
    return tool;
}

const ELEM_MAT = new THREE.MeshStandardMaterial({ color:0xf39c12, roughness:.3, metalness:.1 });

function init() {
    console.log("Initialization started");
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);
    
    const W = window.innerWidth-300, H = window.innerHeight;
    camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 2000);
    camera.position.set(0, 0, 280);
    
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(W, H);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    
    const dl1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dl1.position.set(10,20,30);
    scene.add(dl1);
    
    const dl2 = new THREE.DirectionalLight(0xffffff, 0.4);
    dl2.position.set(-10,-10,10);
    scene.add(dl2);
    
    scene.add(new THREE.AmbientLight(0x444444));
    
    buildGrid();
    bindEvents();
    
    console.log("Initialization complete");
}

function buildGrid() {
    console.log("Building grid...");
    const hr = HEX_S * 0.97;
    const pts2D = Array.from({length:6}, (_,i) => new THREE.Vector2(hr*Math.cos(i*DEG60), hr*Math.sin(i*DEG60)));
    const pts3D = [...pts2D.map(p => new THREE.Vector3(p.x, p.y, 0)), new THREE.Vector3(hr, 0, 0)];
    
    const guideGeo = new THREE.BufferGeometry().setFromPoints(pts3D);
    const guideMat = new THREE.LineBasicMaterial({color:0x3a3a42, transparent:true, opacity:0.9});
    
    const hitGeo = new THREE.ShapeGeometry(new THREE.Shape(pts2D));
    const hitMat = new THREE.MeshBasicMaterial({side:THREE.DoubleSide, visible:false});
    
    for (let q=-20; q<20; q++) {
        for (let r=-14; r<14; r++) {
            const {x,y} = cellPos(q,r);
            const guide = new THREE.Line(guideGeo, guideMat);
            guide.position.set(x, y, -0.5);
            scene.add(guide);
            gridLines.push(guide);
            
            const hit = new THREE.Mesh(hitGeo, hitMat);
            hit.position.set(x, y, 0);
            hit.userData = {q, r};
            scene.add(hit);
            hitPlanes.set(`${q},${r}`, hit);
        }
    }
    console.log("Grid built:", gridLines.length, "lines");
}

function bindEvents() {
    const el = renderer.domElement;
    const raycaster = new THREE.Raycaster();
    const ndcMouse = new THREE.Vector2();
    
    el.addEventListener('click', e => {
        const rect = renderer.domElement.getBoundingClientRect();
        ndcMouse.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
        raycaster.setFromCamera(ndcMouse, camera);
        const hits = raycaster.intersectObjects([...hitPlanes.values()], false);
        if (!hits.length) return;
        
        const {q, r} = hits[0].object.userData;
        const hitPt = hits[0].point;
        const cp = cellPos(q, r);
        const concreteType = resolveType(activeTool, hitPt, cp);
        const slot = concreteType === 'add' ? 'hex' : concreteType;
        const sk = slotKey(q, r, slot);
        
        if (elements.has(sk)) {
            const m = elements.get(sk);
            scene.remove(m);
            m.geometry.dispose();
            elements.delete(sk);
            elementTypes.delete(sk);
        } else {
            const mesh = new THREE.Mesh(buildGeometry(concreteType), ELEM_MAT.clone());
            const {x,y} = cellPos(q,r);
            mesh.position.set(x, y, 0);
            mesh.userData = {q, r, slot};
            scene.add(mesh);
            elements.set(sk, mesh);
            elementTypes.set(sk, concreteType);
        }
        updateStats();
    });
    
    window.addEventListener('resize', () => {
        const W=window.innerWidth-300, H=window.innerHeight;
        camera.aspect=W/H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
    });
}

function updateStats() {
    document.getElementById('hexCount').innerText = elements.size;
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

// Button handlers
document.getElementById('addBtn').addEventListener('click', () => {
    activeTool = 'add';
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById('addBtn').classList.add('active');
});
document.getElementById('hexFullBtn').addEventListener('click', () => { activeTool = 'hexFull'; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active')); });
document.getElementById('trapBtn').addEventListener('click', () => { activeTool = 'trap'; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active')); });
document.getElementById('pentaBtn').addEventListener('click', () => { activeTool = 'penta'; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active')); });
document.getElementById('quartBtn').addEventListener('click', () => { activeTool = 'quart'; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active')); });
document.getElementById('removeBtn').addEventListener('click', () => { activeTool = 'remove'; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active')); });

document.getElementById('exportBtn').addEventListener('click', () => {
    if (!elements.size) return;
    const s = new THREE.Scene();
    elements.forEach(m => s.add(m.clone()));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([new STLExporter().parse(s, {binary:true})], {type:'application/octet-stream'}));
    a.download = 'hsw_design.stl';
    a.click();
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if (!elements.size || !confirm('Tout effacer ?')) return;
    elements.forEach(m => { scene.remove(m); m.geometry.dispose(); });
    elements.clear();
    elementTypes.clear();
    updateStats();
});

init();
animate();
</script>
</body>
</html>
