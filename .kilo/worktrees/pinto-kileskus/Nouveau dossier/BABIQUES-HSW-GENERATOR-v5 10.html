<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HSW Designer Pro</title>
    <style>
        :root {
            --bg-deep: #0d0d0d; --bg-side: #161618; --bg-group: #1e1e21;
            --text-main: #e0e0e0; --text-muted: #88888c;
            --accent: #f39c12; --accent-hover: #e67e22;
            --danger: #c0392b; --border: #2a2a2e;
        }
        body { margin:0; font-family:'Inter','Segoe UI',sans-serif; display:flex; height:100vh; background:var(--bg-deep); color:var(--text-main); overflow:hidden; font-size:13px; }
        #sidebar { width:300px; background:var(--bg-side); padding:25px; display:flex; flex-direction:column; gap:20px; border-right:1px solid var(--border); z-index:100; box-shadow:10px 0 30px rgba(0,0,0,0.5); }
        #sidebar-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:15px; }
        #sidebar-header h1 { margin:0; font-size:1.2em; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
        #sidebar-header h1 span { color:var(--accent); }
        #canvas-container { flex-grow:1; position:relative; outline:none; }
        #canvas-container.painting { cursor:crosshair; }
        #canvas-container.erasing { cursor:cell; }
        .group { background:var(--bg-group); padding:18px; border-radius:6px; border:1px solid var(--border); }
        .group-header { font-size:.85em; text-transform:uppercase; color:var(--text-muted); letter-spacing:1.5px; margin-bottom:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .group-header::before { content:''; display:inline-block; width:6px; height:6px; background:var(--accent); border-radius:1px; }
        .btn { background:transparent; border:1px solid var(--border); padding:10px 14px; color:var(--text-main); cursor:pointer; border-radius:4px; width:100%; margin-bottom:8px; transition:all .2s cubic-bezier(0.4,0,0.2,1); text-align:left; display:flex; align-items:center; gap:10px; font-size:.95em; }
        .btn:hover { background:rgba(255,255,255,.03); border-color:#444; }
        .btn.active { border-color:var(--accent); background:rgba(243,156,18,.08); color:var(--accent); font-weight:600; box-shadow:inset 0 0 12px rgba(243,156,18,.05); }
        .btn svg { width:16px; height:16px; fill:var(--text-muted); transition:fill .2s; }
        .btn.active svg { fill:var(--accent); }
        .btn-main { background:var(--accent); border:none; color:#000; font-weight:700; text-align:center; justify-content:center; text-transform:uppercase; letter-spacing:1px; margin-top:10px; }
        .btn-main:hover { background:var(--accent-hover); transform:translateY(-1px); }
        .btn-danger { background:transparent; border:1px solid rgba(192,57,43,.4); color:var(--danger); text-align:center; justify-content:center; font-size:.9em; margin-top:5px; }
        .btn-danger:hover { background:rgba(192,57,43,.1); border-color:var(--danger); }
        .stats { font-size:.85em; color:var(--text-muted); margin-top:auto; border-top:1px solid var(--border); padding-top:15px; display:flex; justify-content:space-between; }
        .btn-pair, .btn-trio { display:flex; gap:6px; margin-bottom:8px; }
        .btn-trio .btn { flex:1; flex-direction:column; justify-content:center; align-items:center; padding:8px 3px; gap:4px; margin-bottom:0; font-size:.72em; text-align:center; }
        .btn-pair .btn { flex:1; flex-direction:column; justify-content:center; align-items:center; padding:10px 6px; gap:5px; margin-bottom:0; font-size:.78em; }
        #hud { position:absolute; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
        #hud-buttons { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; min-width:220px; }
        #hud-controls { background:rgba(22,22,24,.9); border:1px solid var(--border); border-radius:6px; padding:12px 14px; backdrop-filter:blur(8px); font-size:.78em; color:var(--text-muted); line-height:1.9; min-width:220px; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
        .hud-title { font-size:.75em; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-muted); margin-bottom:8px; font-weight:600; display:flex; align-items:center; gap:6px; }
        .hud-title::before { content:''; display:inline-block; width:5px; height:5px; background:var(--accent); border-radius:1px; }
        .hud-row { display:flex; justify-content:space-between; gap:16px; }
        .hud-key { display:inline-block; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,0.15); border-radius:3px; padding:1px 6px; font-family:monospace; font-size:.9em; color:var(--text-main); white-space:nowrap; }
        .hud-key.paint-active { background:rgba(243,156,18,0.18); border-color:var(--accent); color:var(--accent); }
        .hud-key.erase-active { background:rgba(192,57,43,0.18); border-color:var(--danger); color:var(--danger); }
        .hud-btn { background:rgba(22,22,24,.9); border:1px solid var(--border); border-radius:5px; color:var(--text-muted); cursor:pointer; padding:7px 12px; font-size:.8em; backdrop-filter:blur(8px); transition:all 0.2s; display:flex; align-items:center; gap:6px; }
        .hud-btn:hover { border-color:#555; color:var(--text-main); }
        .hud-btn.active { border-color:var(--accent); color:var(--accent); }
    </style>
</head>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// --- CONFIG & CONSTANTES ---
const HOLE_W = 20, WALL = 1.8, WALL_MIN = 0.8, DEPTH = 8, H_STEP = 2;
const HEX_H = HOLE_W + WALL * 2, HEX_S = HEX_H / Math.sqrt(3);
const INNER_S = HOLE_W / Math.sqrt(3), DEG60 = Math.PI/3;

// --- UTILS ---
function hexPts(r) { return Array.from({length:6}, (_,i) => new THREE.Vector2(r*Math.cos(i*DEG60), r*Math.sin(i*DEG60))); }

function mergeGeos(geos) {
    const positions = [], normals = [], indices = [];
    let offset = 0;
    for (const g of geos) {
        const pos = g.attributes.position.array;
        positions.push(...pos);
        const count = pos.length / 3;
        const idx = g.index ? g.index.array : null;
        if (idx) indices.push(...Array.from(idx).map(i => i + offset));
        else for (let i = 0; i < count; i++) indices.push(i + offset);
        offset += count;
        g.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
    geo.setIndex(indices);
    geo.computeVertexNormals(); // Recalcul indispensable pour les ombres du fraisage
    return geo;
}

function extrude(shape, depth, z=0) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
    if (z) geo.translate(0, 0, z);
    return geo;
}

// --- GÉOMÉTRIES ---

function buildHexByCrown(sb=false) {
    const outer = hexPts(HEX_S);
    const iNarrow = INNER_S + (WALL - WALL_MIN);
    const build = (r, d, z) => {
        const s = new THREE.Shape(outer);
        s.holes.push(new THREE.Path(hexPts(r).reverse()));
        return extrude(s, d, z);
    };
    return sb ? mergeGeos([build(iNarrow, H_STEP, 0), build(INNER_S, DEPTH-H_STEP, H_STEP)])
              : mergeGeos([build(INNER_S, DEPTH-H_STEP, 0), build(iNarrow, H_STEP, DEPTH-H_STEP)]);
}

function buildTrapGeometry(angle, sb=false) {
    const ext = hexPts(HEX_S);
    const build = (innerS, d, z) => {
        const inn = hexPts(innerS);
        const s = new THREE.Shape();
        s.moveTo(ext[0].x, ext[0].y); s.lineTo(ext[1].x, ext[1].y); s.lineTo(ext[2].x, ext[2].y); s.lineTo(ext[3].x, ext[3].y); s.lineTo(ext[0].x, ext[3].y); s.closePath();
        const h = new THREE.Path();
        h.moveTo(inn[0].x - WALL/2, ext[3].y + WALL); h.lineTo(inn[3].x + WALL/2, ext[3].y + WALL); h.lineTo(inn[2].x, inn[2].y); h.lineTo(inn[1].x, inn[1].y); h.lineTo(inn[0].x, inn[0].y); h.closePath();
        s.holes.push(h); return extrude(s, d, z);
    };
    const iNarrow = INNER_S + (WALL - WALL_MIN);
    const geo = sb ? mergeGeos([build(iNarrow, H_STEP, 0), build(INNER_S, DEPTH-H_STEP, H_STEP)])
                   : mergeGeos([build(INNER_S, DEPTH-H_STEP, 0), build(iNarrow, H_STEP, DEPTH-H_STEP)]);
    if (angle) geo.rotateZ(angle);
    return geo;
}

function buildTrapFixGeometry(angle, sb=false) {
    const ext = hexPts(HEX_S);
    const holeY = (ext[1].y + ext[0].y) / 2;
    const shaftR = 1.6, cskR = 4.5, cskDepth = 4.5, CSK_LAYERS = 12;
    function trapWithHole(r) {
        const s = new THREE.Shape();
        s.moveTo(ext[0].x, ext[0].y); s.lineTo(ext[1].x, ext[1].y); s.lineTo(ext[2].x, ext[2].y); s.lineTo(ext[3].x, ext[3].y); s.lineTo(ext[0].x, ext[3].y); s.closePath();
        const h = new THREE.Path(); h.absarc(0, holeY, r, 0, Math.PI*2, true); s.holes.push(h); return s;
    }
    const slices = [], shaftDepth = DEPTH - cskDepth;
    if(sb) {
        slices.push(extrude(trapWithHole(shaftR), shaftDepth, 0));
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = shaftR + (cskR-shaftR)*(i/CSK_LAYERS), rN = shaftR + (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(trapWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, shaftDepth + i*cskDepth/CSK_LAYERS));
        }
    } else {
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = cskR - (cskR-shaftR)*(i/CSK_LAYERS), rN = cskR - (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(trapWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, i*cskDepth/CSK_LAYERS));
        }
        slices.push(extrude(trapWithHole(shaftR), shaftDepth, cskDepth));
    }
    const geo = mergeGeos(slices);
    if (angle) geo.rotateZ(angle);
    return geo;
}

function buildPentaFixGeometry(corner, sb=false) {
    const ext = hexPts(HEX_S), cutX = 0;
    const hx = (cutX + ext[1].x + ext[0].x + ext[5].x + cutX) / 5;
    const hy = (ext[1].y + ext[1].y + ext[0].y + ext[5].y + ext[5].y) / 5;
    const shaftR = 1.6, cskR = 4.5, cskDepth = 4.5, CSK_LAYERS = 12;
    function pentaWithHole(r) {
        const s = new THREE.Shape();
        s.moveTo(cutX, ext[1].y); s.lineTo(ext[1].x, ext[1].y); s.lineTo(ext[0].x, ext[0].y); s.lineTo(ext[5].x, ext[5].y); s.lineTo(cutX, ext[5].y); s.closePath();
        const h = new THREE.Path(); h.absarc(hx, hy, r, 0, Math.PI*2, true); s.holes.push(h); return s;
    }
    const slices = [], shaftDepth = DEPTH - cskDepth;
    if(sb) {
        slices.push(extrude(pentaWithHole(shaftR), shaftDepth, 0));
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = shaftR + (cskR-shaftR)*(i/CSK_LAYERS), rN = shaftR + (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(pentaWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, shaftDepth + i*cskDepth/CSK_LAYERS));
        }
    } else {
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = cskR - (cskR-shaftR)*(i/CSK_LAYERS), rN = cskR - (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(pentaWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, i*cskDepth/CSK_LAYERS));
        }
        slices.push(extrude(pentaWithHole(shaftR), shaftDepth, cskDepth));
    }
    const geo = mergeGeos(slices);
    geo.rotateZ(corner * DEG60);
    return geo;
}

function buildPentaGeometry(corner, sb=false) {
    const ext = hexPts(HEX_S);
    const build = (innerS, d, z) => {
        const inn = hexPts(innerS);
        const s = new THREE.Shape();
        s.moveTo(0, ext[1].y); s.lineTo(ext[1].x, ext[1].y); s.lineTo(ext[0].x, ext[0].y); s.lineTo(ext[5].x, ext[5].y); s.lineTo(0, ext[5].y); s.closePath();
        const h = new THREE.Path();
        h.moveTo(WALL, inn[5].y); h.lineTo(inn[5].x, inn[5].y); h.lineTo(inn[0].x, inn[0].y); h.lineTo(inn[1].x, inn[1].y); h.lineTo(WALL, inn[1].y); h.closePath();
        s.holes.push(h); return extrude(s, d, z);
    };
    const iNarrow = INNER_S + (WALL - WALL_MIN);
    const geo = sb ? mergeGeos([build(iNarrow, H_STEP, 0), build(INNER_S, DEPTH-H_STEP, H_STEP)])
                   : mergeGeos([build(INNER_S, DEPTH-H_STEP, 0), build(iNarrow, H_STEP, DEPTH-H_STEP)]);
    geo.rotateZ(corner * DEG60); return geo;
}

function buildHexFullGeometry() { return extrude(new THREE.Shape(hexPts(HEX_S)), DEPTH); }
function buildHexFixFullGeometry(sb=false) {
    const shaftR = 1.6, cskR = 4.5, cskDepth = 4.5, CSK_LAYERS = 12;
    function hexWithHole(r) {
        const s = new THREE.Shape(hexPts(HEX_S));
        const h = new THREE.Path(); h.absarc(0,0,r,0,Math.PI*2,true); s.holes.push(h); return s;
    }
    const slices = [], shaftDepth = DEPTH-cskDepth;
    if(sb) {
        slices.push(extrude(hexWithHole(shaftR), shaftDepth, 0));
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = shaftR + (cskR-shaftR)*(i/CSK_LAYERS), rN = shaftR + (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(hexWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, shaftDepth + i*cskDepth/CSK_LAYERS));
        }
    } else {
        for(let i=0; i<CSK_LAYERS; i++) {
            const r = cskR - (cskR-shaftR)*(i/CSK_LAYERS), rN = cskR - (cskR-shaftR)*((i+1)/CSK_LAYERS);
            slices.push(extrude(hexWithHole(Math.max(r,rN)), cskDepth/CSK_LAYERS, i*cskDepth/CSK_LAYERS));
        }
        slices.push(extrude(hexWithHole(shaftR), shaftDepth, cskDepth));
    }
    return mergeGeos(slices);
}
function buildTrapFullGeometry(a) { const s = new THREE.Shape(); const e = hexPts(HEX_S); s.moveTo(e[0].x,e[0].y); s.lineTo(e[1].x,e[1].y); s.lineTo(e[2].x,e[2].y); s.lineTo(e[3].x,e[3].y); s.lineTo(e[0].x,e[3].y); s.closePath(); const g = extrude(s,DEPTH); if(a) g.rotateZ(a); return g; }
function buildPentaFullGeometry(c) { const e = hexPts(HEX_S); const s = new THREE.Shape(); s.moveTo(0,e[1].y); s.lineTo(e[1].x,e[1].y); s.lineTo(e[0].x,e[0].y); s.lineTo(e[5].x,e[5].y); s.lineTo(0,e[5].y); s.closePath(); const g = extrude(s,DEPTH); g.rotateZ(c*DEG60); return g; }

// --- APP ---
let scene, camera, orthoCamera, renderer, controls, activeTool='add', shoulderDir='back', isOrtho=false, gridVisible=true;
const elements = new Map(), hitPlanes = new Map();
const mat = new THREE.MeshStandardMaterial({ color: 0xf39c12, roughness: 0.3, metalness: 0.1 });

// Injection des icônes originales que j'avais supprimées par erreur
const GRID_ICON = `<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3,3 L17,3 M3,10 L17,10 M3,17 L17,17 M3,3 L3,17 M10,3 L10,17 M17,3 L17,17"/></svg>`;
const RESET_ICON = `<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><polyline points="10,6 10,10 13,10"/></svg>`;
const VIEW_ICON_ORTHO = `<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><polygon points="10,3 17,7 10,11 3,7" fill="rgba(255,255,255,0.06)"/><polygon points="3,7 10,11 10,17 3,13" fill="rgba(255,255,255,0.03)"/><polygon points="17,7 10,11 10,17 17,13" fill="rgba(255,255,255,0.09)"/></svg>`;
const VIEW_ICON_PERSP = `<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="6" y="6" width="7" height="7" fill="rgba(255,255,255,0.06)"/><polygon points="6,6 13,6 16,3 9,3" fill="rgba(255,255,255,0.09)"/><polygon points="13,6 16,3 16,10 13,13" fill="rgba(255,255,255,0.03)"/></svg>`;

function init() {
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0d0d);
    const aspect = (window.innerWidth-300)/window.innerHeight;
    camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 2000); camera.position.set(0, 0, 250);
    orthoCamera = new THREE.OrthographicCamera(-150*aspect, 150*aspect, 150, -150, 0.1, 2000); orthoCamera.position.set(0, 0, 250);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth-300, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0x444444), new THREE.DirectionalLight(0xffffff, 1.5).set(10, 20, 30));

    const hitGeo = new THREE.ShapeGeometry(new THREE.Shape(hexPts(HEX_S*0.95)));
    for(let q=-15; q<15; q++) {
        for(let r=-10; r<10; r++) {
            const x = q * HEX_S * 1.5, y = r * HEX_H + (q % 2 ? HEX_H/2 : 0);
            const hit = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05, visible: true }));
            hit.position.set(x, y, 0); hit.userData = {q, r};
            scene.add(hit); hitPlanes.set(`${q},${r}`, hit);
        }
    }

    document.getElementById('gridToggleBtn').innerHTML = GRID_ICON + ' Grille';
    document.getElementById('resetViewBtn').innerHTML = RESET_ICON + ' Centrer';
    document.getElementById('viewToggleBtn').innerHTML = VIEW_ICON_PERSP;

    renderer.domElement.addEventListener('click', (e) => onAction(e, false));
    renderer.domElement.addEventListener('mousemove', (e) => { if(e.buttons === 1 && (e.shiftKey || e.altKey)) onAction(e, true); });
    window.addEventListener('resize', onResize);
    animate();
}

function onAction(e, isDrag) {
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, isOrtho ? orthoCamera : camera);
    const hits = ray.intersectObjects([...hitPlanes.values()]);
    if(!hits.length) return;

    const {q, r} = hits[0].object.userData, id = `${q},${r}`, cp = hits[0].object.position;
    const dx = hits[0].point.x - cp.x, dy = hits[0].point.y - cp.y;
    const angleIdx = Math.floor((Math.atan2(dy, dx) + Math.PI + Math.PI/6) / (Math.PI/3)) % 6;
    const sb = shoulderDir === 'back';

    if(e.altKey || activeTool === 'remove') {
        if(elements.has(id)) { scene.remove(elements.get(id)); elements.delete(id); }
    } else {
        if(elements.has(id) && isDrag) return;
        if(elements.has(id)) scene.remove(elements.get(id));
        let geo;
        if(activeTool === 'add') geo = buildHexByCrown(sb);
        else if(activeTool === 'hexFull') geo = buildHexFullGeometry();
        else if(activeTool === 'hexFixFull') geo = buildHexFixFullGeometry(sb);
        else if(activeTool === 'trap') geo = buildTrapGeometry(angleIdx*DEG60, sb);
        else if(activeTool === 'trapFull') geo = buildTrapFullGeometry(angleIdx*DEG60);
        else if(activeTool === 'trapFix') geo = buildTrapFixGeometry(angleIdx*DEG60, sb);
        else if(activeTool === 'penta') geo = buildPentaGeometry(angleIdx, sb);
        else if(activeTool === 'pentaFull') geo = buildPentaFullGeometry(angleIdx);
        else if(activeTool === 'pentaFix') geo = buildPentaFixGeometry(angleIdx, sb);
        const mesh = new THREE.Mesh(geo, mat); mesh.position.set(cp.x, cp.y, 0);
        scene.add(mesh); elements.set(id, mesh);
    }
    document.getElementById('hexCount').innerText = elements.size;
}

function onResize() {
    const aspect = (window.innerWidth-300)/window.innerHeight;
    camera.aspect = aspect; camera.updateProjectionMatrix();
    orthoCamera.left = -150*aspect; orthoCamera.right = 150*aspect; orthoCamera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth-300, window.innerHeight);
}

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, isOrtho ? orthoCamera : camera); }

// UI
document.querySelectorAll('.btn').forEach(btn => {
    btn.onclick = () => {
        if(btn.id.startsWith('shoulder')) {
            shoulderDir = btn.id.includes('Back') ? 'back' : 'front';
            document.getElementById('shoulderFrontBtn').classList.toggle('active', shoulderDir==='front');
            document.getElementById('shoulderBackBtn').classList.toggle('active', shoulderDir==='back');
        } else if(!['exportBtn','clearBtn'].includes(btn.id)) {
            activeTool = btn.id.replace('Btn', '');
            document.querySelectorAll('.btn').forEach(b => { if(!b.id.startsWith('shoulder')) b.classList.toggle('active', b===btn); });
        }
    };
});

document.getElementById('gridToggleBtn').onclick = () => { gridVisible = !gridVisible; hitPlanes.forEach(h => h.material.visible = gridVisible); document.getElementById('gridToggleBtn').classList.toggle('active', gridVisible); };
document.getElementById('resetViewBtn').onclick = () => controls.reset();
document.getElementById('viewToggleBtn').onclick = () => { isOrtho = !isOrtho; document.getElementById('viewToggleBtn').innerHTML = isOrtho ? VIEW_ICON_ORTHO : VIEW_ICON_PERSP; controls.object = isOrtho ? orthoCamera : camera; controls.update(); };
document.getElementById('clearBtn').onclick = () => { elements.forEach(m => scene.remove(m)); elements.clear(); document.getElementById('hexCount').innerText = '0'; };
document.getElementById('exportBtn').onclick = () => {
    const s = new THREE.Scene(); elements.forEach(m => s.add(m.clone()));
    const data = new STLExporter().parse(s, { binary: true });
    const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' })); link.download = 'hsw_design.stl'; link.click();
};

init();
</script>
</body>
</html>
